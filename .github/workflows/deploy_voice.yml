name: Deploy Modal Voice Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: pip install --upgrade modal

      - name: Create/Update Modal Secret & Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          VOICE_API_SECRET: ${{ secrets.VOICE_API_SECRET }}
        run: |
          modal secret create rs-voice-secret VOICE_API_SECRET="$VOICE_API_SECRET" --force
          modal deploy voice_server.py
