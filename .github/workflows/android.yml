name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    # YAHAN FIX KIYA HAI: Naya step jo local.properties generate karega
    - name: Create local.properties
      run: |
        echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > local.properties
        echo "HUGGING_FACE_KEY=${{ secrets.HUGGING_FACE_KEY }}" >> local.properties

    # YAHAN FIX KIYA HAI: Env block hata diya aur ./gradlew use kiya
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
